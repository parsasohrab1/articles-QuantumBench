[project]
name = "quantumbench"
version = "0.1.0"
description = "Quantum (VQE) versus classical energy estimation for small molecules under shot noise (simulation)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
